name: IPA patch validation

on:
  push:
    branches:
      - feature/ipa-patching
  pull_request:
    paths:
      - 'ipa_patch.py'
      - 'ipa_macho_inject.py'
      - 'tests/**'
      - 'docs/IPA_PATCHING.md'
      - '.github/workflows/ipa-tests.yml'

jobs:
  ipa-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM64 Mach-O dependencies
        run: python -m pip install keystone-engine==0.9.2 'capstone>=5,<6' 'lief>=0.17,<2'
      - name: Compile
        run: python -m py_compile ipa_patch.py ipa_macho_inject.py tests/test_ipa_patch.py tests/test_ipa_macho_inject.py
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
