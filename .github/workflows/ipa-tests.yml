name: IPA patch validation

on:
  push:
    branches:
      - feature/ipa-patching
  pull_request:
    paths:
      - 'ipa_patch.py'
      - 'tests/test_ipa_patch.py'
      - 'docs/IPA_PATCHING.md'
      - '.github/workflows/ipa-tests.yml'

jobs:
  ipa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional ARM64 assembler
        run: python -m pip install keystone-engine==0.9.2
      - name: Compile
        run: python -m py_compile ipa_patch.py tests/test_ipa_patch.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
